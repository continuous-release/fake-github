[package]
name = "fake-github"
version = "0.12.0"
edition = "2021"
description = "A small in-memory GitHub API server used as a test double for the continuous-release toolkit."
license = "MIT"
repository = "https://github.com/continuous-release/fake-github"

[lib]
name = "fake_github"
path = "src/lib.rs"

[[bin]]
name = "fake-github"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
